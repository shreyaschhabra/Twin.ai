# TrustTwin.ai — FULL 45-STATION FACTORY (Step 4, locked topology)
#
# Four zones: Body/Joining (S01-S12, 12), Paint/Surface (S13-S20, 8),
# General/Final Assembly (S21-S38, 18), Inspection/EOL (S39-S45, 7).
#
# Reuses the exact same ~10 station-type templates from station_types.yaml
# as the 12-station development line — no new types were needed. Loaded
# by the same backend/config/loader.py, validated by the same
# backend/config/schemas.py, with zero code changes.
#
# All cycle times, variability, sensor availability, and process
# parameters are ILLUSTRATIVE SIMULATION ASSUMPTIONS, not sourced from a
# real plant. See ASSUMPTIONS.md for the calibration/line-balance history.
#
# Sensor maturity: exactly 29 rich / 10 partial / 6 poor (locked).
# Poor = S11,S21,S22,S24,S33,S38 (all manual-family stations).
# Partial = S05,S07,S16,S25,S29,S30,S32,S34,S35,S41.
# Rich = every other station (29 total).

line_name: "trusttwin_full_line_45"

stations:
  # ============================================================ ZONE 1: BODY / JOINING (S01-S12)
  S01:
    station_name: "Underbody Framing"
    station_type: WELDING_BODY_JOINING
    specific_operation: "Robotic spot welding of underbody frame rails"
    baseline_cycle_time_seconds: 46
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [weld_current, weld_time, electrode_force, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_weld_current_amps: 9200}
    notes: "First body station; sets underbody frame geometry."

  S02:
    station_name: "Floor-Pan Welding"
    station_type: WELDING_BODY_JOINING
    specific_operation: "Robotic spot welding of floor pan to frame"
    baseline_cycle_time_seconds: 50
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [weld_current, weld_time, electrode_force, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_weld_current_amps: 9000}
    notes: "Same TYPE as S01, distinct operation and target."

  S03:
    station_name: "Body Side Panel Joining"
    station_type: WELDING_BODY_JOINING
    specific_operation: "Robotic spot welding of left/right body side panels"
    baseline_cycle_time_seconds: 55
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [weld_current, weld_voltage, weld_time, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_weld_current_amps: 8800}
    notes: "Larger panel, longer weld schedule than S01/S02."

  S04:
    station_name: "Roof Joining"
    station_type: WELDING_BODY_JOINING
    specific_operation: "Robotic laser/spot welding of roof panel to body sides"
    baseline_cycle_time_seconds: 42
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [weld_current, weld_time, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_weld_current_amps: 8600}
    notes: "Roof seam join, fewer weld points than side panels."

  S05:
    station_name: "Structural Adhesive / Body Bonding"
    station_type: ADHESIVE_SEALING
    specific_operation: "Structural adhesive application for body panel bonding"
    baseline_cycle_time_seconds: 32
    cycle_time_variability: 0.12
    sensor_maturity: partial
    available_sensors: [adhesive_flow_rate, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_adhesive_flow_rate_ml_s: 4.0}
    notes: "Legacy dispense rig, flow meter only (matches dev-line S03 precedent)."

  S06:
    station_name: "Robotic Body Handling / Positioning"
    station_type: ROBOTIC_HANDLING_ASSEMBLY
    specific_operation: "Robotic repositioning of body-in-white between weld cells"
    baseline_cycle_time_seconds: 30
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [force_sensor, position_sensor, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Material-handling step between weld operations, not a joining operation itself."

  S07:
    station_name: "Closure Panel Fitting"
    station_type: ROBOTIC_HANDLING_ASSEMBLY
    specific_operation: "Robotic fitting of doors/hood/trunk closures to body"
    baseline_cycle_time_seconds: 48
    cycle_time_variability: 0.10
    sensor_maturity: partial
    available_sensors: [position_sensor, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Older robotic cell; no force-sensor retrofit yet."

  S08:
    station_name: "Body Geometry Inspection"
    station_type: DIMENSIONAL_INSPECTION
    specific_operation: "Automated laser/vision scan of body geometry post-closures"
    baseline_cycle_time_seconds: 26
    cycle_time_variability: 0.05
    sensor_maturity: rich
    available_sensors: [laser_scan, vision_camera, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Confirms door/hood/trunk gaps before further assembly."

  S09:
    station_name: "Additional Spot Welding / Reinforcement"
    station_type: WELDING_BODY_JOINING
    specific_operation: "Robotic reinforcement welding of high-stress body points"
    baseline_cycle_time_seconds: 38
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [weld_current, weld_time, electrode_force, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_weld_current_amps: 9400}
    notes: "Reinforcement pass; fewer, higher-current welds than S01-S04."

  S10:
    station_name: "Seam / Body Joining"
    station_type: WELDING_BODY_JOINING
    specific_operation: "Robotic seam welding of remaining body joints"
    baseline_cycle_time_seconds: 44
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [weld_current, weld_voltage, weld_time, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_weld_current_amps: 8700}
    notes: "Final structural weld pass before body finishing."

  S11:
    station_name: "Body Finishing / Manual Inspection"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual visual/tactile inspection and finishing of weld seams"
    baseline_cycle_time_seconds: 65
    cycle_time_variability: 0.22
    sensor_maturity: poor
    available_sensors: [cycle_time, checklist_completion]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Legacy manual station; only timestamp/checklist data exist."

  S12:
    station_name: "Body-Out Dimensional Check"
    station_type: DIMENSIONAL_INSPECTION
    specific_operation: "Final body-in-white dimensional scan before paint"
    baseline_cycle_time_seconds: 25
    cycle_time_variability: 0.05
    sensor_maturity: rich
    available_sensors: [laser_scan, vision_camera, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Zone-1 exit gate; last check before the body enters paint."

  # ============================================================ ZONE 2: PAINT / SURFACE PROCESSING (S13-S20)
  S13:
    station_name: "Pretreatment"
    station_type: PAINT_COATING
    specific_operation: "Chemical pretreatment wash and phosphate coating"
    baseline_cycle_time_seconds: 40
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [booth_temperature, booth_humidity, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_booth_temperature_c: 35}
    notes: "Environmental monitoring typical for compliance reasons."

  S14:
    station_name: "E-Coat Application"
    station_type: PAINT_COATING
    specific_operation: "Electrocoat dip application"
    baseline_cycle_time_seconds: 55
    cycle_time_variability: 0.07
    sensor_maturity: rich
    available_sensors: [booth_temperature, film_thickness, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_film_thickness_um: 20}
    notes: "First protective coating layer."

  S15:
    station_name: "E-Coat Cure"
    station_type: CURING_ENVIRONMENTAL
    specific_operation: "Oven cure of electrocoat layer"
    baseline_cycle_time_seconds: 62
    cycle_time_variability: 0.05
    sensor_maturity: rich
    available_sensors: [oven_temperature, belt_speed, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_oven_temperature_c: 175}
    notes: "EFFECTIVE SERVICE/HEADWAY ABSTRACTION (see S06/S20 in dev line and ASSUMPTIONS.md): represents cure-tunnel exit rate, not real multi-vehicle dwell time. Chosen to match neighboring stations' pace, not a target utilization."

  S16:
    station_name: "Sealer Application"
    station_type: ADHESIVE_SEALING
    specific_operation: "Underbody and seam sealant application"
    baseline_cycle_time_seconds: 34
    cycle_time_variability: 0.11
    sensor_maturity: partial
    available_sensors: [adhesive_flow_rate, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_adhesive_flow_rate_ml_s: 5.0}
    notes: "Legacy sealant rig, flow meter only."

  S17:
    station_name: "Primer Application"
    station_type: PAINT_COATING
    specific_operation: "Primer surfacer spray application"
    baseline_cycle_time_seconds: 46
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [booth_temperature, booth_humidity, film_thickness, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_film_thickness_um: 30}
    notes: "Prepares surface for color coat."

  S18:
    station_name: "Base / Colour Coat"
    station_type: PAINT_COATING
    specific_operation: "Base color coat spray application"
    baseline_cycle_time_seconds: 50
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [booth_temperature, booth_humidity, film_thickness, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_film_thickness_um: 18}
    notes: "Applies vehicle exterior color."

  S19:
    station_name: "Clear Coat"
    station_type: PAINT_COATING
    specific_operation: "Clear coat spray application"
    baseline_cycle_time_seconds: 48
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [booth_temperature, film_thickness, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_film_thickness_um: 22}
    notes: "Protective clear top coat."

  S20:
    station_name: "Paint Cure + Paint Inspection"
    station_type: CURING_ENVIRONMENTAL
    specific_operation: "Final paint cure oven and in-line paint inspection"
    baseline_cycle_time_seconds: 66
    cycle_time_variability: 0.05
    sensor_maturity: rich
    available_sensors: [oven_temperature, humidity, belt_speed, vision_camera, cycle_time]
    sensor_justifications: {vision_camera: "final-cure vision inspection bolted onto the cure-oven exit, not part of the base CURING_ENVIRONMENTAL template"}
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_oven_temperature_c: 165}
    notes: "EFFECTIVE SERVICE/HEADWAY ABSTRACTION, same principle as S15/dev-line S06. Paint-zone exit gate before final assembly."

  # ============================================================ ZONE 3: GENERAL / FINAL ASSEMBLY (S21-S38)
  S21:
    station_name: "Trim Preparation"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual preparation of interior trim components for install"
    baseline_cycle_time_seconds: 70
    cycle_time_variability: 0.20
    sensor_maturity: poor
    available_sensors: [cycle_time, checklist_completion]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Legacy manual station."

  S22:
    station_name: "Wiring Harness Installation"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual installation of main wiring harness"
    baseline_cycle_time_seconds: 88
    cycle_time_variability: 0.24
    sensor_maturity: poor
    available_sensors: [cycle_time, checklist_completion]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Legacy manual station; matches dev-line wiring precedent."

  S23:
    station_name: "Instrument Panel Installation"
    station_type: ROBOTIC_HANDLING_ASSEMBLY
    specific_operation: "Robot-assisted instrument panel placement"
    baseline_cycle_time_seconds: 40
    cycle_time_variability: 0.07
    sensor_maturity: rich
    available_sensors: [force_sensor, position_sensor, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Robot places IP assembly; fastening handled separately downstream."

  S24:
    station_name: "HVAC / Interior Module Installation"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual installation of HVAC unit and interior modules"
    baseline_cycle_time_seconds: 75
    cycle_time_variability: 0.20
    sensor_maturity: poor
    available_sensors: [cycle_time, checklist_completion]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Legacy manual station."

  S25:
    station_name: "Glass Installation / Sealing"
    station_type: ADHESIVE_SEALING
    specific_operation: "Robotic windshield/window glass bonding"
    baseline_cycle_time_seconds: 36
    cycle_time_variability: 0.10
    sensor_maturity: partial
    available_sensors: [adhesive_flow_rate, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_adhesive_flow_rate_ml_s: 3.5}
    notes: "Older glass-set cell, flow meter only."

  S26:
    station_name: "Powertrain / Battery Pack Marriage"
    station_type: ROBOTIC_HANDLING_ASSEMBLY
    specific_operation: "Robotic marriage of chassis subframe (powertrain or battery pack) to body"
    baseline_cycle_time_seconds: 72
    cycle_time_variability: 0.09
    sensor_maturity: rich
    available_sensors: [force_sensor, position_sensor, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_insertion_force_n: 1850}
    variant_overrides:
      ICE_SEDAN: {operation_profile: powertrain_marriage, cycle_time_multiplier: 1.0}
      ICE_SUV:   {operation_profile: powertrain_marriage, cycle_time_multiplier: 1.10}
      EV:        {operation_profile: battery_pack_marriage, cycle_time_multiplier: 1.20}
    notes: "Same physical station, semantically different operation by variant (matches dev-line S07 precedent)."

  S27:
    station_name: "Powertrain / Battery Pack Mounting Fastening"
    station_type: TORQUE_FASTENING
    specific_operation: "Torque-controlled fastening of powertrain/battery-pack mounts"
    baseline_cycle_time_seconds: 22
    cycle_time_variability: 0.08
    sensor_maturity: rich
    available_sensors: [torque_value, torque_angle, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_torque_nm: 48}
    notes: "Secures the subframe married at S26."

  S28:
    station_name: "Suspension / Chassis Fastening"
    station_type: TORQUE_FASTENING
    specific_operation: "Torque-controlled fastening of suspension/chassis components"
    baseline_cycle_time_seconds: 26
    cycle_time_variability: 0.08
    sensor_maturity: rich
    available_sensors: [torque_value, torque_angle, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_torque_nm: 90}
    notes: "Same TYPE as S27, distinct fastening operation/target."

  S29:
    station_name: "Seat Installation"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Semi-automated seat placement (lift-assisted manual install)"
    baseline_cycle_time_seconds: 55
    cycle_time_variability: 0.15
    sensor_maturity: partial
    available_sensors: [cycle_time, checklist_completion, position_sensor]
    sensor_justifications: {position_sensor: "lift-assist rig retrofit provides a basic seat-placement position reading, beyond the base MANUAL_ASSEMBLY template"}
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Partially instrumented manual station — a meaningful step above poor."

  S30:
    station_name: "Seat Torque Verification"
    station_type: TORQUE_FASTENING
    specific_operation: "Torque-controlled seat mounting bolt verification"
    baseline_cycle_time_seconds: 18
    cycle_time_variability: 0.10
    sensor_maturity: partial
    available_sensors: [torque_value, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_torque_nm: 45}
    notes: "Older pneumatic tool, final torque only, no angle curve (matches dev-line S10 precedent)."

  S31:
    station_name: "Wheel Installation"
    station_type: ROBOTIC_HANDLING_ASSEMBLY
    specific_operation: "Robotic wheel mounting onto hub"
    baseline_cycle_time_seconds: 20
    cycle_time_variability: 0.07
    sensor_maturity: rich
    available_sensors: [force_sensor, position_sensor, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Robotic wheel-mounter; fastening handled separately at S32."

  S32:
    station_name: "Wheel Torque"
    station_type: TORQUE_FASTENING
    specific_operation: "Torque-controlled wheel bolt tightening"
    baseline_cycle_time_seconds: 16
    cycle_time_variability: 0.10
    sensor_maturity: partial
    available_sensors: [torque_value, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {target_torque_nm: 140}
    notes: "Legacy pneumatic tool (matches dev-line precedent exactly)."

  S33:
    station_name: "Door / Closure Finishing"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual final fit/finish adjustment of doors and closures"
    baseline_cycle_time_seconds: 58
    cycle_time_variability: 0.20
    sensor_maturity: poor
    available_sensors: [cycle_time, checklist_completion]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Legacy manual station."

  S34:
    station_name: "Electrical Connection / System Check"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual connection of remaining electrical systems with basic continuity check"
    baseline_cycle_time_seconds: 68
    cycle_time_variability: 0.16
    sensor_maturity: partial
    available_sensors: [cycle_time, checklist_completion, functional_test_suite]
    sensor_justifications: {functional_test_suite: "a basic pass/fail continuity tester was retrofitted at this manual station, beyond the base MANUAL_ASSEMBLY template"}
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Partially instrumented manual station."

  S35:
    station_name: "Fluid-Related Process / Preparation"
    station_type: FLUID_FILL_FUNCTIONAL
    specific_operation: "Fuel system fill and preparation (ICE only)"
    baseline_cycle_time_seconds: 38
    cycle_time_variability: 0.12
    sensor_maturity: partial
    available_sensors: [flow_rate, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV]
    process_parameters: {target_fill_volume_l: 55}
    notes: "ICE-only: EV has no fuel system and skips this station entirely (the one deliberate route branch/skip in this line, same principle as dev-line S11)."

  S36:
    station_name: "Variant-Specific ICE / EV Process"
    station_type: FLUID_FILL_FUNCTIONAL
    specific_operation: "Final fluid-system check (ICE) or battery thermal-loop conditioning check (EV)"
    baseline_cycle_time_seconds: 42
    cycle_time_variability: 0.08
    sensor_maturity: rich
    available_sensors: [flow_rate, fill_pressure, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    variant_overrides:
      ICE_SEDAN: {operation_profile: ice_final_fluid_system_check, cycle_time_multiplier: 1.0}
      ICE_SUV:   {operation_profile: ice_final_fluid_system_check, cycle_time_multiplier: 1.05}
      EV:        {operation_profile: ev_battery_thermal_conditioning_check, cycle_time_multiplier: 1.15}
    notes: "PRIMARY variant-profile station (Section G): all three variants pass through S36 on the shared route, but perform a semantically different check via variant_overrides.operation_profile — same mechanism as S26, not a route skip. The one actual skip in this zone is at S35."

  S37:
    station_name: "Functional Assembly Check"
    station_type: INSPECTION_EOL_TESTING
    specific_operation: "Mid-line functional check of assembled electrical/mechanical systems"
    baseline_cycle_time_seconds: 46
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [functional_test_suite, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Not a QC gate — an internal functional check before final trim."

  S38:
    station_name: "Final Trim / Manual Inspection"
    station_type: MANUAL_ASSEMBLY
    specific_operation: "Manual final trim adjustment and visual inspection"
    baseline_cycle_time_seconds: 60
    cycle_time_variability: 0.20
    sensor_maturity: poor
    available_sensors: [cycle_time, checklist_completion]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Legacy manual station; final assembly-zone exit gate."

  # ============================================================ ZONE 4: INSPECTION / END-OF-LINE (S39-S45)
  S39:
    station_name: "Dimensional / Final Visual Check"
    station_type: DIMENSIONAL_INSPECTION
    specific_operation: "Automated final dimensional and visual scan"
    baseline_cycle_time_seconds: 28
    cycle_time_variability: 0.05
    sensor_maturity: rich
    available_sensors: [laser_scan, vision_camera, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "First EOL inspection gate."

  S40:
    station_name: "Electrical Diagnostics"
    station_type: INSPECTION_EOL_TESTING
    specific_operation: "Full-vehicle electrical diagnostic scan"
    baseline_cycle_time_seconds: 40
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [functional_test_suite, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Diagnostic scan of all electrical subsystems."

  S41:
    station_name: "Leak / Pressure Test"
    station_type: FLUID_FILL_FUNCTIONAL
    specific_operation: "Pressure-based leak test of fluid systems"
    baseline_cycle_time_seconds: 35
    cycle_time_variability: 0.11
    sensor_maturity: partial
    available_sensors: [fill_pressure, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Older leak-test rig; no dedicated leak_sensor retrofit yet."

  S42:
    station_name: "Functional Test"
    station_type: INSPECTION_EOL_TESTING
    specific_operation: "Comprehensive functional test of vehicle systems"
    baseline_cycle_time_seconds: 50
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [functional_test_suite, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Broader functional test than S37/S40."

  S43:
    station_name: "Dynamic / Roll Test"
    station_type: INSPECTION_EOL_TESTING
    specific_operation: "Dynamometer roll test"
    baseline_cycle_time_seconds: 55
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [roll_test_sensor, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Drive-system validation under load."

  S44:
    station_name: "Final Quality Inspection"
    station_type: INSPECTION_EOL_TESTING
    specific_operation: "Final comprehensive visual and functional quality inspection"
    baseline_cycle_time_seconds: 52
    cycle_time_variability: 0.06
    sensor_maturity: rich
    available_sensors: [vision_camera, functional_test_suite, cycle_time]
    applicable_vehicle_variants: [ICE_SEDAN, ICE_SUV, EV]
    process_parameters: {}
    notes: "Last inspection before release/EOL QC."

  S45:
