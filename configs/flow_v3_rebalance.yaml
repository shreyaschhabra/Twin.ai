# Flow-v3 nominal-line rebalance overlay.
#
# This file is intentionally separate from full_line.yaml so the working
# Flow-v2 simulator/config remains reproducible. Values were selected from
# process semantics and capacity margin only, before any Flow-v3 pilot labels
# or ML results exist.

plan_id: flow_v3_rebalance_review_1

cycle_time_overrides:
  S11:
    old_seconds: 65.0
    new_seconds: 72.0
    rationale: "Manual weld-seam finishing includes a more complete tactile/visual confirmation; +10.8% remains within a plausible manual inspection cycle."
  S20:
    old_seconds: 66.0
    new_seconds: 73.0
    rationale: "The effective paint-cure exit service includes the in-line paint inspection and handling allowance; +10.6% preserves the effective-headway abstraction."
  S21:
    old_seconds: 70.0
    new_seconds: 75.0
    rationale: "Trim preparation includes manual staging and verification before the constrained wiring operation; +7.1% is a modest manual-work-content correction without changing S22."
  S43:
    old_seconds: 55.0
    new_seconds: 64.0
    rationale: "The dynamic/roll test cycle includes stabilization, the test sequence, and release confirmation; +16.4% is plausible for a fuller test protocol and remains below line headway."

buffer_capacity_overrides:
  B10:
    old_capacity: 4
    new_capacity: 3
    rationale: "Selected constrained manual finishing queue feeding S11; three staged bodies is plausible and no capacity deficit is inferred from this change."
  B23:
    old_capacity: 4
    new_capacity: 3
    rationale: "Manual HVAC/interior-module installation has limited safe kit/body staging immediately upstream."
  B33:
    old_capacity: 4
    new_capacity: 3
    rationale: "Manual electrical connection/check area has constrained staging and handling space."
  B38:
    old_capacity: 4
    new_capacity: 3
    rationale: "Final manual trim/inspection uses a constrained presentation queue rather than a true accumulator."
  B43:
    old_capacity: 4
    new_capacity: 3
    rationale: "The dynamic/roll-test approach is a controlled test-bay queue with limited staging."

unchanged_design_notes:
  - "S22 cycle time is intentionally unchanged."
  - "B20 remains capacity 5 as a zone-boundary accumulator before trim preparation."
  - "B21 remains capacity 4 so the already-constrained S22 is not made artificially dominant by buffer shrinkage."
  - "Existing capacity-5 branch, cure, and zone-boundary accumulators remain unchanged."
