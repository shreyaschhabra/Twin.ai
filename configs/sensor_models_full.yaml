# Illustrative sensor model parameters for the 45-station full line.
# Keyed by (station_id, sensor_name) — NOT shared with
# sensor_models_dev.yaml, since the two line configs reuse the same
# S01-S12 numbering for entirely different stations (see sensors.py).
# Every entry corresponds to a sensor actually listed in that station's
# `available_sensors` in configs/full_line.yaml. "cycle_time" is
# deliberately excluded everywhere (duplicates STATION_PROCESSING_COMPLETED).
#
# All baseline/noise/valid-range values are illustrative simulation
# assumptions, not sourced from real equipment specs. See ASSUMPTIONS.md.

stations:
  S01:
    weld_current:    {unit: amps, baseline: 9200, noise_std: 150, valid_min: 7000, valid_max: 11000}
    weld_time:       {unit: ms, baseline: 380, noise_std: 15, valid_min: 200, valid_max: 600}
    electrode_force: {unit: newtons, baseline: 2200, noise_std: 80, valid_min: 1500, valid_max: 3000}
